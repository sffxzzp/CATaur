name: Playwright Tests

# on:
#   push:
#     branches: [yanling]
#   branches: [main]
# pull_request:
#   branches: [main]
# workflow_dispatch:

on:
  push:
    branches: [yanling]
  pull_request:
    branches: [yanling]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - site: http://candidate.kawaiimonkey.top
            role: candidate
          - site: http://client.kawaiimonkey.top
            role: client
          - site: http://manager.kawaiimonkey.top
            role: admin
    defaults:
      run:
        working-directory: next-client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: next-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run:
          npx playwright install --with-deps
          # ✅ wait for deployment to be ready (adjust time as needed)
      - name: Wait for deployment
        run: sleep 40
      - name: Run Playwright tests
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ matrix.site }}
          TEST_ROLE: ${{ matrix.role }}

        run: npx playwright test --project=chromium

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: next-client/playwright-report

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: next-client/test-results
